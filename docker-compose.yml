# docker-compose.yml — robinhood-for-agents behind @bolyra/gateway
#
# This example runs:
#   1. robinhood-for-agents MCP server (bound to internal network only)
#   2. @bolyra/gateway reverse proxy (exposed on port 4100)
#
# The gateway verifies agent identity and enforces per-tool permissions
# defined in gateway.yaml before forwarding requests to the MCP server.
#
# Prerequisites:
#   - Run `npx robinhood-for-agents onboard` on the host first (see docs/DOCKER.md)
#   - Copy the encryption key into .env as ROBINHOOD_TOKEN_KEY
#
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose up

services:
  # -----------------------------------------------------------------------
  # robinhood-for-agents MCP server
  # Bound to the internal network — not exposed to the host.
  # The gateway is the only ingress path.
  # -----------------------------------------------------------------------
  robinhood-mcp:
    image: node:22-alpine
    working_dir: /app
    command: ["npx", "robinhood-for-agents"]
    environment:
      ROBINHOOD_TOKENS_FILE: /secrets/tokens.enc
      ROBINHOOD_TOKEN_KEY: "${ROBINHOOD_TOKEN_KEY}"
    volumes:
      - ${ROBINHOOD_TOKENS_PATH:-~/.robinhood-for-agents/tokens.enc}:/secrets/tokens.enc:rw
    networks:
      - internal
    # Not exposed — only reachable from the gateway via the internal network.

  # -----------------------------------------------------------------------
  # @bolyra/gateway — auth proxy
  # Verifies agent ZKP credentials, enforces tool-level permissions,
  # blocks replay attacks, and writes signed receipts.
  # -----------------------------------------------------------------------
  bolyra-gateway:
    image: ghcr.io/bolyra/gateway:latest
    ports:
      - "4100:4100"
    environment:
      BOLYRA_RECEIPT_KEY: "${BOLYRA_RECEIPT_KEY}"
    volumes:
      - ./gateway.yaml:/etc/bolyra/gateway.yaml:ro
      - receipts:/app/receipts
    depends_on:
      - robinhood-mcp
    networks:
      - internal

volumes:
  receipts:

networks:
  internal:
    driver: bridge
