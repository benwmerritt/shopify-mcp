# gateway.yaml — @bolyra/gateway config for robinhood-for-agents
#
# This maps robinhood-for-agents tool names to Bolyra permission tiers.
# See docs/AGENT-IDENTITY.md for the tier rationale and docs/ACCESS_CONTROLS.md
# for the full tool list.
#
# Permission bitmask reference (cumulative — higher tiers imply lower):
#   Bit 0: READ_DATA        (1)
#   Bit 1: WRITE_DATA       (2)
#   Bit 2: FINANCIAL_SMALL  (4)  — < $100
#   Bit 3: FINANCIAL_MEDIUM (8)  — < $10K (implies bit 2)
#   Bit 4: FINANCIAL_UNLIMITED (16) — implies bits 2+3
#
# An agent whose credential carries permBits=1 (READ_DATA only) can call
# get_portfolio but NOT place_stock_order. The gateway rejects the request
# before it reaches robinhood-for-agents.

target: http://robinhood-mcp:3000/mcp
port: 4100

# Dev mode uses mock ZKP verification — set to false for production.
devMode: true

# --- Read-only tier (requireBitmask: 1 = READ_DATA) ---
tools:
  robinhood_get_portfolio:
    requireBitmask: 1
  robinhood_get_accounts:
    requireBitmask: 1
  robinhood_get_account:
    requireBitmask: 1
  robinhood_get_stock_quote:
    requireBitmask: 1
  robinhood_get_historicals:
    requireBitmask: 1
  robinhood_get_news:
    requireBitmask: 1
  robinhood_search:
    requireBitmask: 1
  robinhood_get_options:
    requireBitmask: 1
  robinhood_get_crypto:
    requireBitmask: 1
  robinhood_get_movers:
    requireBitmask: 1
  robinhood_get_orders:
    requireBitmask: 1
  robinhood_get_order_status:
    requireBitmask: 1
  robinhood_check_session:
    requireBitmask: 1

  # --- Write tier (requireBitmask: 3 = READ_DATA + WRITE_DATA) ---
  robinhood_cancel_order:
    requireBitmask: 3

  # --- Trade tier (requireBitmask: 13 = READ + FINANCIAL_SMALL + FINANCIAL_MEDIUM) ---
  # Adjust the bitmask based on your risk tolerance. FINANCIAL_MEDIUM (< $10K)
  # is a reasonable default; use 29 to require FINANCIAL_UNLIMITED.
  robinhood_place_stock_order:
    requireBitmask: 13
  robinhood_place_option_order:
    requireBitmask: 13
  robinhood_place_crypto_order:
    requireBitmask: 13

  # --- Blocked (no bitmask can satisfy — agents must never trigger login) ---
  robinhood_browser_login:
    requireBitmask: 255
    maxChainDepth: 0

# Nonce replay protection
nonce:
  store: memory
  maxProofAge: 300

# Signed receipts for trade audit
receipts:
  enabled: true
  issuer: "robinhood-gateway-example"
  keyId: "k1"
  privateKey: "${BOLYRA_RECEIPT_KEY}"
  output: file
  dir: /app/receipts/
